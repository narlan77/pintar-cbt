<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Uji Koneksi Server GS & Database</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
    <div class="container" style="max-width: 600px;">
        <div class="card shadow">
            <div class="card-body">
                <h4 class="card-title mb-3">Diagnostic Tool: Server GS & DB</h4>
                
                <div class="mb-3">
                    <label class="form-label">URL Web App Google Apps Script:</label>
                    <input type="text" id="targetUrl" class="form-control" placeholder="https://script.google.com/macros/s/.../exec">
                </div>

                <div class="mb-3">
                    <label class="form-label">Aksi Uji (Action):</label>
                    <select id="targetAction" class="form-select">
                        <option value="getpengguna">Cek Koneksi & Ambil Data Pengguna (Get Pengguna)</option>
                        <option value="loginguru">Uji Login Guru (Simulasi)</option>
                    </select>
                </div>

                <div id="formLoginParam" class="d-none">
                    <div class="mb-3">
                        <label class="form-label">Username / NIP:</label>
                        <input type="text" id="testUser" class="form-control" value="admin">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password:</label>
                        <input type="password" id="testPass" class="form-control">
                    </div>
                </div>

                <button class="btn btn-primary w-100 mb-3" onclick="jalankanTes()">Jalankan Tes Sekarang</button>

                <label class="form-label">Hasil Respons Server:</label>
                <pre id="logResult" class="bg-dark text-white p-3 rounded" style="height: 200px; overflow-y: auto;">Menunggu pengujian...</pre>
            </div>
        </div>
    </div>

    <script>
        // Tampilkan form login jika opsi login dipilih
        document.getElementById('targetAction').addEventListener('change', function() {
            if (this.value === 'loginguru') {
                document.getElementById('formLoginParam').classList.remove('d-none');
            } else {
                document.getElementById('formLoginParam').classList.add('d-none');
            }
        });

        async function jalankanTes() {
            const url = document.getElementById('targetUrl').value.trim();
            const action = document.getElementById('targetAction').value;
            const logBox = document.getElementById('logResult');

            if (!url) {
                alert('Masukkan URL Web App GS terlebih dahulu!');
                return;
            }

            logBox.innerText = "Mengirim permintaan ke server GS...";

            let payload = { action: action };
            if (action === 'loginguru') {
                payload.username = document.getElementById('testUser').value;
                payload.password = document.getElementById('testPass').value;
            }

            try {
                // Menggunakan mode 'no-cors' atau langsung fetch jika deployment mengizinkan cross-origin standar JSON
                const response = await fetch(url, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });

                const textResult = await response.text();
                
                try {
                    const jsonResult = JSON.parse(textResult);
                    logBox.innerText = JSON.stringify(jsonResult, null, 2);
                    if (jsonResult.status === 'success') {
                        logBox.className = "bg-success text-white p-3 rounded";
                    } else {
                        logBox.className = "bg-warning text-dark p-3 rounded";
                    }
                } catch (e) {
                    // Jika gagal parse JSON, berarti server mengembalikan HTML Error (misal error script GS)
                    logBox.className = "bg-danger text-white p-3 rounded";
                    logBox.innerText = "GAGAL PARSE JSON (Kemungkinan besar error script GS / HTML):\n\n" + textResult;
                }

            } catch (err) {
                logBox.className = "bg-danger text-white p-3 rounded";
                logBox.innerText = "Kesalahan Jaringan / CORS:\n" + err.toString();
            }
        }
    </script>
</body>
</html>
